apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "product-service.fullname" . }}
  labels:
    release: monitoring
    app.kubernetes.io/name: {{ include "product-service.name" . }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "product-service.name" . }}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
